[env:m5stack-stamps3]
platform = espressif32 @ 6.13.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@9.0.0
    m5stack/M5Dial@^1.0.2
    m5stack/M5Unified@^0.1.12
    bblanchon/ArduinoJson@^7.0.0
    mlesniew/PicoMQTT@^1.3.0
build_flags =
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
